# 检索层配置 —— Day 2: jieba 自定义词典 + BM25 基线 + 评测脚本骨架
# 所有相对路径相对于 project/ 根目录

paths:
  scenes: ../Rewrite_terra/data/scenes.jsonl   # Day 1 真值切分产物 (480 chunks)
  user_dict: data/user_dict.txt                # jieba 自定义词典
  qaset: eval/qaset_seed.json                  # 种子评测集(冒烟用,数字不进报告)
  answers: eval/answers.jsonl                  # 答案层输入(Day 4 生成模块产出;不存在则跳过)
  runs_dir: runs

index:
  tokenizers: [jieba, bigram]   # 原理点①对照两臂: 词典分词 vs 字符 bigram
  k1: 1.5                       # BM25 词频饱和
  b: 0.75                       # BM25 长度归一化
  index_speakers: false         # true=把 chunk 的 speakers 元数据并入索引文本(消融开关)

eval:
  k_values: [3, 5, 10]
  mrr_depth: 10                 # MRR 的检索深度

demo:
  sample_queries:
    - 路易斯是什么国籍？
    - 瑚太朗和路易斯约定了什么？
    - 盖亚和守护者是什么关系？
